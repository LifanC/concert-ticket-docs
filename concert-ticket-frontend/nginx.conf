limit_req_zone $binary_remote_addr zone=api_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_requests:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=connections:10m;

server {
    listen 10000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 11m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"status":429,"message":"Too many requests"}';
    }

    location ~ ^/api/v1/login/(login|register)/?$ {
        limit_req zone=login_requests burst=5 nodelay;
        limit_conn connections 10;
        proxy_pass https://concert-ticket-backend-pdvo.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host concert-ticket-backend-pdvo.onrender.com;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Spring Boot API
    location /api/ws {
        limit_req zone=api_requests burst=30 nodelay;
        limit_conn connections 20;
        proxy_pass https://concert-ticket-backend-pdvo.onrender.com;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_set_header Host concert-ticket-backend-pdvo.onrender.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Spring Boot API
    location /api/ {
        limit_req zone=api_requests burst=30 nodelay;
        limit_conn connections 20;
        proxy_pass https://concert-ticket-backend-pdvo.onrender.com;

        proxy_ssl_server_name on;
        proxy_set_header Host concert-ticket-backend-pdvo.onrender.com;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
