# -----------------------------
# JWT 設定
# -----------------------------
jwt:
  refreshExpirationSeconds: 3600
  accessExpirationSeconds: 1800

analytics:
  enabled: ${ANALYTICS_ENABLED:true}
  directory: ${ANALYTICS_DIRECTORY:}
  python: ${ANALYTICS_PYTHON:}
  delay-ms: ${ANALYTICS_DELAY_MS:1800000}
  timeout-seconds: ${ANALYTICS_TIMEOUT_SECONDS:120}

auth:
  cookie:
    secure: ${REFRESH_COOKIE_SECURE:true}
    sameSite: ${REFRESH_COOKIE_SAME_SITE:Lax}

# -----------------------------
# Server 設定
# -----------------------------
server:
  port: ${PORT:8080}
  forward-headers-strategy: none
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# -----------------------------
# Spring Boot 相關設定
# -----------------------------
spring:
  config:
    # 支援從專案根目錄或後端目錄啟動；後端 .env 優先於根目錄 .env。
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:concert-ticket-backend/.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: demo-app-test

  # Redis 連線設定
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2s
      password: ${REDIS_PASSWORD:}

  # 資料庫連線設定
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interviewworks?currentSchema=interviewworks_ticket}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

# -----------------------------
# 訂單逾期掃描設定
# -----------------------------
booking:
  payment:
    simulation-enabled: ${PAYMENT_SIMULATION_ENABLED:false}
  expiration:
    scan-delay-ms: 30000 # 每輪掃描結束後等待 30 秒；不是付款期限

# -----------------------------
# MyBatis 設定
# -----------------------------
mybatis:
  mapper-locations: classpath:Mapper/**/*.xml  # 指定 Mapper XML 對應檔的位置
  configuration:
    # org.apache.ibatis.logging.stdout.StdOutImpl
    # org.apache.ibatis.logging.slf4j.Slf4jImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    mapUnderscoreToCamelCase: true # 將底線分隔的欄位名稱對應至駝峰命名的屬性

# -----------------------------
# Logging 設定
# -----------------------------
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n%ex"
  # 日誌層級
  level:
    root: INFO
    org.springframework: INFO
    org.mybatis: INFO
    # 設定指定 Mapper 套件的日誌層級
    com.demo.ticket.Mapper: INFO

security:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,https://concert-ticket-frontend.onrender.com}
  limits:
    window-seconds: 60
    api-per-ip: 300
    login-per-ip: 20
    login-per-account: 10
    register-per-ip: 5
    refresh-per-ip: 60
    refresh-per-session: 20
    booking-per-user: 20
    ws-per-ip: 120
    ws-connect-per-user: 10
    ws-messages-per-user: 120
  websocket:
    max-connections: 1000
    max-connections-per-ip: 20
    max-connections-per-user: 5
