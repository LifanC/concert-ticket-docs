# -----------------------------
# JWT 設定
# -----------------------------
jwt:
  refreshExpirationSeconds: 3600
  accessExpirationSeconds: 1800

analytics:
  enabled: ${ANALYTICS_ENABLED:true}
  directory: ${ANALYTICS_DIRECTORY:}
  python: ${ANALYTICS_PYTHON:}
  delay-ms: ${ANALYTICS_DELAY_MS:1800000}
  timeout-seconds: ${ANALYTICS_TIMEOUT_SECONDS:120}

auth:
  cookie:
    secure: ${REFRESH_COOKIE_SECURE:false}

# -----------------------------
# Server 設定
# -----------------------------
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# -----------------------------
# Spring Boot 相關設定
# -----------------------------
spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: demo-app-test

  # Redis 連線設定
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000
      password: ${REDIS_PASSWORD}

  # 資料庫連線設定
  datasource:
    url: jdbc:postgresql://localhost:5432/interviewworks?currentSchema=interviewworks_ticket
    username: postgres
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

# -----------------------------
# MyBatis 設定
# -----------------------------
mybatis:
  mapper-locations: classpath:Mapper/**/*.xml  # 指定 Mapper XML 對應檔的位置
  configuration:
    # org.apache.ibatis.logging.stdout.StdOutImpl：將 SQL 日誌直接輸出至主控台
    # org.apache.ibatis.logging.log4j2.Log4j2Impl：透過 Log4j2 記錄日誌
    # org.apache.ibatis.logging.jdk14.Jdk14LoggingImpl：透過 JDK 內建日誌系統記錄日誌
    log-impl: org.apache.ibatis.logging.jdk14.Jdk14LoggingImpl
    mapUnderscoreToCamelCase: true # 將底線分隔的欄位名稱對應至駝峰命名的屬性

# -----------------------------
# Logging 設定
# -----------------------------
logging:
  config: classpath:log4j2.xml
  # 日誌層級
  level:
    # 設定指定 Mapper 套件的日誌層級
    com.example.demo.Mapper: DEBUG
    me.paulschwarz: DEBUG
