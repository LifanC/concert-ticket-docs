services:
  app:
    build:
      context: ./concert-ticket-backend
    image: springboot-app:1.0
    container_name: springboot-container
    env_file:
      - .env
    ports:
      - "8080:8080"          # 本機 8080 對應容器 8080
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    
  frontend:
    build:
      context: ./concert-ticket-frontend
    container_name: vue-container
    ports:
      - "5173:5173"
    volumes:
      - ./concert-ticket-frontend:/app
      - /app/node_modules
    depends_on:
      - app
    restart: unless-stopped

  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interviewworks"]
      interval: 5s
      timeout: 5s
      retries: 5
    image: postgres:16
    container_name: postgres-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: interviewworks
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis-container
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres-data: