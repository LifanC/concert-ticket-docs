  name: Concert Ticket CI

  on:
    push:
      branches:
        - master
        - develop

  permissions:
    contents: read

  jobs:
    frontend-build:
      name: 前端建置
      runs-on: ubuntu-latest
      timeout-minutes: 15

      defaults:
        run:
          working-directory: concert-ticket-frontend

      steps:
        - name: 下載程式碼
          uses: actions/checkout@v4

        - name: 準備 Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: npm
            cache-dependency-path: concert-ticket-frontend/package-lock.json

        - name: 安裝依賴
          run: npm ci

        - name: 建置前端
          run: npm run build

    backend-test:
      name: 後端測試
      runs-on: ubuntu-latest
      timeout-minutes: 15

      services:
        postgres:
          image: postgres:16
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ci-test-password
            POSTGRES_DB: interviewworks
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U postgres -d interviewworks"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10
        redis:
          image: redis:7
          ports:
            - 6379:6379
          options: >-
            --health-cmd "redis-cli ping"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10

      defaults:
        run:
          working-directory: concert-ticket-backend

      env:
        POSTGRES_PASSWORD: ci-test-password
        REDIS_PASSWORD: ''
        ANALYTICS_ENABLED: 'false'

      steps:
        - name: 下載程式碼
          uses: actions/checkout@v4

        - name: 準備 Java 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven
            cache-dependency-path: concert-ticket-backend/pom.xml

        - name: 初始化測試資料庫
          env:
            POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          run: >-
            docker exec -i "$POSTGRES_CONTAINER_ID"
            psql -U postgres -d interviewworks -v ON_ERROR_STOP=1
            < ../db-init/init.sql

        - name: 執行後端測試
          run: bash mvnw --batch-mode clean test

        - name: 顯示後端測試錯誤
          if: failure()
          run: |
            shopt -s nullglob
            reports=(target/surefire-reports/*.txt)
            if ((${#reports[@]})); then
              cat "${reports[@]}"
            fi

        - name: 保存後端測試報告
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: backend-test-reports
            path: concert-ticket-backend/target/surefire-reports/
            if-no-files-found: ignore
            retention-days: 7

    analytics-test:
      name: Python 報表測試
      runs-on: ubuntu-latest
      timeout-minutes: 10

      defaults:
        run:
          working-directory: concert-ticket-analytics

      steps:
        - name: 下載程式碼
          uses: actions/checkout@v4

        - name: 準備 Python
          uses: actions/setup-python@v6
          with:
            python-version: '3.12'
            cache: pip
            cache-dependency-path: concert-ticket-analytics/requirements.txt

        - name: 安裝依賴
          run: python -m pip install -r requirements.txt

        - name: 執行報表測試
          run: python -m unittest -v test_analyze
