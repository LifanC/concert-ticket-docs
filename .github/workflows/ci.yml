  name: Frontend CI

  on:
    push:
    pull_request:

  permissions:
    contents: read

  jobs:
    frontend-build:
      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: concert-ticket-frontend

      steps:
        - name: 下載程式碼
          uses: actions/checkout@v4

        - name: 準備 Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: npm
            cache-dependency-path: concert-ticket-frontend/package-lock.json

        - name: 安裝依賴
          run: npm ci

        - name: 建置前端
          run: npm run build